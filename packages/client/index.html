<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="WallStreetVerse - a multiplayer trading-floor world with authoritative server simulation and three connected zones."
    />
    <title>WallStreetVerse</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070a10;
        color: #dbe7f3;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow: hidden;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #app canvas {
        display: block;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
        pointer-events: none;
      }
      #boot h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #4cc9f0;
      }
      #boot p {
        margin: 0;
        font-size: 13px;
        color: #7d8597;
      }
      #boot .keys {
        font-size: 12px;
        color: #5c6675;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <h1>WallStreetVerse</h1>
      <p>Loading the trading floor...</p>
      <p class="keys">WASD or arrow keys to move · F3 for the debug overlay</p>
    </div>
    <noscript>
      <p style="padding: 24px">WallStreetVerse needs JavaScript to run.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
