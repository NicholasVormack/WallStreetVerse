# WallStreetVerse Phase 1 infrastructure.
# Spin up: docker compose up -d
# Tear down: docker compose down -v
services:
  postgres:
    image: postgres:16
    container_name: ws_postgres
    environment:
      POSTGRES_USER: ws_dev
      POSTGRES_PASSWORD: ws_dev_password
      POSTGRES_DB: wallstreet_verse
    ports:
      - "5432:5432"
    volumes:
      - ws_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ws_dev -d wallstreet_verse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ws_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ws_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ws_postgres_data:
  ws_redis_data:
